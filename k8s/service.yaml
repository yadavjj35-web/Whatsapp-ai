# path: k8s/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: whatsapp-ai
  labels:
    app: whatsapp-ai
spec:
  type: ClusterIP
  selector:
    app: whatsapp-ai
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whatsapp-ai-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  rules:
    - host: whatsapp-ai.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: whatsapp-ai
                port:
                  number: 80
  # TLS can be added by creating a TLS secret and uncommenting the TLS block
  # tls:
  #   - hosts:
  #       - whatsapp-ai.example.com
  #     secretName: whatsapp-ai-tls
