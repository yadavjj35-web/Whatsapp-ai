# path: k8s/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-ai
  labels:
    app: whatsapp-ai
spec:
  replicas: 3
  selector:
    matchLabels:
      app: whatsapp-ai
  template:
    metadata:
      labels:
        app: whatsapp-ai
    spec:
      containers:
        - name: whatsapp-ai-api
          image: ghcr.io/yadavjj35-web/whatsapp-ai:latest
          imagePullPolicy: Always
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: MONGODB_URI
              value: "mongodb://mongo:27017/whatsapp-ai"
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      imagePullSecrets:
        - name: regcred
      restartPolicy: Always
