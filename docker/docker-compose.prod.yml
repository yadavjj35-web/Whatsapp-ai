# path: docker/docker-compose.prod.yml
version: '3.8'
services:
  app:
    image: ghcr.io/yadavjj35-web/whatsapp-ai:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - MONGODB_URI=mongodb://mongo:27017/whatsapp-ai
      - QUEUE_PREFIX=waai
    ports:
      - "3000:3000"
    depends_on:
      - redis
      - mongo
    networks:
      - waai-net

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: ["redis-server", "--save", "900", "1", "--appendonly", "yes"]
    networks:
      - waai-net

  mongo:
    image: mongo:6.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - waai-net

  qdrant:
    image: qdrant/qdrant:v1.2.8
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__SERVICE__PORT: 6333
    ports:
      - "6333:6333"
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - waai-net

volumes:
  redis-data:
  mongo-data:
  qdrant-storage:

networks:
  waai-net:
    driver: bridge
