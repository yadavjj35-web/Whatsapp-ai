name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - '*'

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-

      - name: Install dependencies
        run: npm ci

      - name: Run auditCompletion (file presence & baseline checks)
        run: node scripts/auditCompletion.js
        continue-on-error: false

      - name: Run unit tests (Node built-in test runner)
        run: |
          # Node 20+ built-in test runner
          node --test --test-threads=1 --no-warnings

      - name: Run linter if configured
        run: |
          if npm run | grep -q "lint"; then npm run lint; else echo "No lint script"; fi

      - name: Upload audit report artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.json
